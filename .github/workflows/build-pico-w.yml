
name: Build Raspberry Pi Pico W Firmware

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Raspberry Pi Pico core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index
          arduino-cli core install rp2040:rp2040

      - name: Prepare sketch directory
        run: |
          mkdir -p sketch
          cp sketch.ino sketch/sketch.ino

      - name: Compile for Pico W
        run: |
          mkdir -p build

          arduino-cli compile \
            --fqbn rp2040:rp2040:rpipicow \
            --output-dir build \
            sketch

      - name: Generate UF2 and HEX
        run: |
          set -e

          echo "Build output:"
          ls -lh build/

          ELF=$(find build -maxdepth 1 -name '*.elf' -print -quit)

          if [ -z "$ELF" ]; then
            echo "ERROR: ELF file was not generated."
            exit 1
          fi

          UF2=$(find build -maxdepth 1 -name '*.uf2' -print -quit)

          if [ -z "$UF2" ]; then
            echo "ERROR: UF2 file was not generated."
            exit 1
          fi

          cp "$UF2" build/pico-w-wifi.uf2

          OBJCOPY=$(find "$HOME/.arduino15/packages/rp2040" \
            -type f -name arm-none-eabi-objcopy -print -quit)

          if [ -z "$OBJCOPY" ]; then
            echo "ERROR: arm-none-eabi-objcopy not found."
            exit 1
          fi

          "$OBJCOPY" -O ihex "$ELF" build/pico-w-wifi.hex

          echo "Generated firmware:"
          ls -lh build/pico-w-wifi.*

      - name: Upload UF2 and HEX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pico-w-wifi-firmware
          path: |
            build/pico-w-wifi.uf2
            build/pico-w-wifi.hex
          if-no-files-found: error
          retention-days: 30
