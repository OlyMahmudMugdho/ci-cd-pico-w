
name: Build Pico W MQTT WebSocket Firmware

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Raspberry Pi Pico core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index
          arduino-cli core install rp2040:rp2040

      - name: Install MQTT and WebSocket libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "MQTTPubSubClient"
          arduino-cli lib install "WebSockets"

      - name: Prepare sketch
        run: |
          mkdir -p sketch build
          cp sketch.ino sketch/sketch.ino

      - name: Compile for Pico W
        run: |
          arduino-cli compile \
            --fqbn rp2040:rp2040:rpipicow \
            --output-dir build \
            sketch

      - name: Generate UF2 and HEX
        run: |
          set -e

          ELF=$(find build -maxdepth 1 -name '*.elf' -print -quit)
          UF2=$(find build -maxdepth 1 -name '*.uf2' -print -quit)

          test -n "$ELF" || {
            echo "ELF firmware missing"
            exit 1
          }

          test -n "$UF2" || {
            echo "UF2 firmware missing"
            exit 1
          }

          cp "$UF2" build/pico-w-mqtt-ws.uf2

          OBJCOPY=$(find "$HOME/.arduino15/packages/rp2040" \
            -type f -name arm-none-eabi-objcopy -print -quit)

          test -n "$OBJCOPY" || {
            echo "arm-none-eabi-objcopy missing"
            exit 1
          }

          "$OBJCOPY" -O ihex "$ELF" build/pico-w-mqtt-ws.hex

          ls -lh build/pico-w-mqtt-ws.*

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pico-w-mqtt-ws-firmware
          path: |
            build/pico-w-mqtt-ws.uf2
            build/pico-w-mqtt-ws.hex
          if-no-files-found: error
          retention-days: 30
